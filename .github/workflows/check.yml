name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install dependencies
        run: pnpm install

      # tina/__generated__ is gitignored, and two suites import the generated
      # client. --local builds against a local GraphQL server, so no TinaCloud
      # credentials are needed here.
      - name: Generate Tina client
        run: pnpm exec tinacms build --local --skip-indexing --skip-cloud-checks

      # TinaCloud serves the schema from the committed tina-lock.json on main, and
      # every deploy build fails its cloud check when the lock differs from the
      # schema that tina/ generates. The build above rewrites the lock, so a diff
      # here means the PR changed tina/ without committing the regenerated lock.
      - name: Check tina-lock.json is up to date
        run: |
          if ! git diff --quiet -- tina/tina-lock.json; then
            echo "::error file=tina/tina-lock.json::tina-lock.json is out of date. Run 'pnpm exec tinacms build --local --skip-indexing --skip-cloud-checks' and commit tina/tina-lock.json."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
