name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: "Target environment (staging or production)"
      slot_name:
        type: string
        required: false
        default: ""
        description: "Deployment slot name (e.g., pr-123). Only used for PR deployments."
      ref:
        type: string
        required: false
        default: ""
        description: "Git ref to checkout (defaults to github.sha if not specified)"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_SERVICE_PRINCIPAL_OBJECT_ID:
        required: true
    outputs:
      resourceGroup:
        description: "Deployed resource group name"
        value: ${{ jobs.deploy.outputs.resourceGroup }}
      appServiceName:
        description: "App Service name"
        value: ${{ jobs.deploy.outputs.appServiceName }}
      appServiceHostName:
        description: "App Service hostname"
        value: ${{ jobs.deploy.outputs.appServiceHostName }}
      slotName:
        description: "Deployment slot name (empty if no slot)"
        value: ${{ jobs.deploy.outputs.slotName }}
      slotHostName:
        description: "Deployment slot hostname (empty if no slot)"
        value: ${{ jobs.deploy.outputs.slotHostName }}
      acrName:
        description: "Azure Container Registry name"
        value: ${{ jobs.deploy.outputs.acrName }}
      acrLoginServer:
        description: "Azure Container Registry login server"
        value: ${{ jobs.deploy.outputs.acrLoginServer }}
      appInsightsConnectionString:
        description: "Application Insights connection string"
        value: ${{ jobs.deploy.outputs.appInsightsConnectionString }}
      rulesChatSqlServerFqdn:
        description: "Rules Chat SQL server hostname"
        value: ${{ jobs.deploy.outputs.rulesChatSqlServerFqdn }}
      rulesChatDatabaseName:
        description: "Rules Chat database name"
        value: ${{ jobs.deploy.outputs.rulesChatDatabaseName }}
      rulesChatIdentityClientId:
        description: "Client ID of the managed identity the site uses for Rules Chat"
        value: ${{ jobs.deploy.outputs.rulesChatIdentityClientId }}
      rulesChatAiEndpoint:
        description: "Rules Chat OpenAI-compatible model endpoint"
        value: ${{ jobs.deploy.outputs.rulesChatAiEndpoint }}
      rulesChatChatModel:
        description: "Rules Chat chat model deployment name"
        value: ${{ jobs.deploy.outputs.rulesChatChatModel }}
      rulesChatEmbeddingModel:
        description: "Rules Chat embedding model deployment name"
        value: ${{ jobs.deploy.outputs.rulesChatEmbeddingModel }}

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      resourceGroup: ${{ steps.deploy.outputs.resourceGroup }}
      appServiceName: ${{ steps.deploy.outputs.appServiceName }}
      appServiceHostName: ${{ steps.deploy.outputs.appServiceHostName }}
      slotName: ${{ steps.deploy.outputs.slotName }}
      slotHostName: ${{ steps.deploy.outputs.slotHostName }}
      acrName: ${{ steps.deploy.outputs.acrName }}
      acrLoginServer: ${{ steps.deploy.outputs.acrLoginServer }}
      appInsightsConnectionString: ${{ steps.deploy.outputs.appInsightsConnectionString }}
      rulesChatSqlServerFqdn: ${{ steps.deploy.outputs.rulesChatSqlServerFqdn }}
      rulesChatDatabaseName: ${{ steps.deploy.outputs.rulesChatDatabaseName }}
      rulesChatIdentityClientId: ${{ steps.deploy.outputs.rulesChatIdentityClientId }}
      rulesChatAiEndpoint: ${{ steps.deploy.outputs.rulesChatAiEndpoint }}
      rulesChatChatModel: ${{ steps.deploy.outputs.rulesChatChatModel }}
      rulesChatEmbeddingModel: ${{ steps.deploy.outputs.rulesChatEmbeddingModel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Azure CLI - Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The index job's image must exist before the Bicep below points the job at it. The registry already exists in
      # staging and production. PR slot deploys share staging's job, so they skip this.
      - name: Build and push Rules Chat index job image
        if: inputs.slot_name == ''
        run: |
          ACR_NAME="acrsswrules${{ inputs.environment == 'production' && 'prod' || inputs.environment }}"
          IMAGE="$ACR_NAME.azurecr.io/rules-chat-index:${{ inputs.environment }}"
          az acr login --name "$ACR_NAME"
          docker build --platform linux/amd64 -f scripts/rules-chat/job/Dockerfile -t "$IMAGE" scripts/rules-chat
          docker push "$IMAGE"

      - name: Deploy Infrastructure
        id: deploy
        shell: pwsh
        run: |
          $params = @{}
          $params['Environment'] = "${{ inputs.environment }}"
          $params['ResourceGroup'] = "${{ vars.AZURE_RESOURCE_GROUP }}"
          $params['ServicePrincipalObjectId'] = "${{ secrets.AZURE_SERVICE_PRINCIPAL_OBJECT_ID }}"

          # PR deploys run this workflow from main against the PR's own commit. An older branch's deploy.ps1 can't take
          # the parameter below, and its Bicep would remove the shared Rules Chat identity from the staging site.
          if (-not (Get-Command ./infra/deploy.ps1).Parameters.ContainsKey('RulesChatSqlAdminClientId')) {
              throw "This branch predates The Rulekeeper infrastructure. Merge or rebase main into it, then deploy again."
          }

          # The pipeline administers the Rules Chat database, so it can apply schema changes on every deploy.
          $params['RulesChatSqlAdminClientId'] = "${{ secrets.AZURE_CLIENT_ID }}"
          # The index job reads the content branch this environment shows, like the site build does.
          $params['RulesChatContentBranch'] = "${{ vars.NEXT_PUBLIC_TINA_BRANCH || 'main' }}"
          $params['RulesChatAlertEmail'] = "${{ vars.RULES_CHAT_ALERT_EMAIL }}"

          $slotName = "${{ inputs.slot_name }}"
          if ($slotName) {
              $params['SlotName'] = $slotName
          }

          ./infra/deploy.ps1 @params

      - name: Log infrastructure outputs
        run: |
          echo "Infrastructure Deployment Complete"
          echo "Resource Group: ${{ steps.deploy.outputs.resourceGroup }}"
          echo "App Service: ${{ steps.deploy.outputs.appServiceName }}"
          echo "App Service URL: https://${{ steps.deploy.outputs.appServiceHostName }}"
          echo "ACR: ${{ steps.deploy.outputs.acrLoginServer }}"
          SLOT_NAME="${{ steps.deploy.outputs.slotName }}"
          if [ -n "$SLOT_NAME" ]; then
            echo "Slot Name: $SLOT_NAME"
            echo "Slot URL: https://${{ steps.deploy.outputs.slotHostName }}"
          fi

      # The Rules Chat database is shared by staging and its PR slots, so only staging and production deploys change it.
      - name: Setup .NET
        if: inputs.slot_name == ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/RulesChat/global.json

      - name: Migrate Rules Chat database
        if: inputs.slot_name == ''
        env:
          RESOURCE_GROUP: ${{ steps.deploy.outputs.resourceGroup }}
          SQL_SERVER_NAME: ${{ steps.deploy.outputs.rulesChatSqlServerName }}
          # Signs in as the pipeline, the server's Microsoft Entra admin, through the Azure CLI login above.
          ConnectionStrings__RulesChat: "Server=tcp:${{ steps.deploy.outputs.rulesChatSqlServerFqdn }},1433;Database=${{ steps.deploy.outputs.rulesChatDatabaseName }};Authentication=Active Directory Default;Encrypt=True"
          RULES_CHAT_SITE_IDENTITY_NAME: ${{ steps.deploy.outputs.rulesChatIdentityName }}
          RULES_CHAT_SITE_IDENTITY_CLIENT_ID: ${{ steps.deploy.outputs.rulesChatIdentityClientId }}
        run: |
          # The SQL firewall only admits Azure services. Open it to this runner for the length of this step.
          RULE="github-actions-${{ github.run_id }}-${{ github.run_attempt }}"
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" --name "$RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" --output none
          trap 'az sql server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" --name "$RULE" --output none' EXIT

          dotnet run --project src/RulesChat/RulesChat.Database --configuration Release
