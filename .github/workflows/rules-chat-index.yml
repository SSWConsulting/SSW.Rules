name: Index Rules for The Ruleferret

# Starts the Container Apps index job now, instead of waiting for its hourly run, and waits for it to finish. Without
# options it embeds only the new and changed rules, like the hourly run.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to index"
        type: choice
        default: staging
        options:
          - staging
          - production
      reembed:
        description: "Embed every rule again, replacing each one as it goes (the chat keeps a full index throughout)"
        type: boolean
        default: false
      allow_removals:
        description: "Allow removals: let this run remove more than a fifth of the index (only when that many rules really were archived or deleted)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  index:
    name: Index Rules
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Covers the index job's own two-hour limit (replicaTimeout in infra/modules/rulesChatIndexJob.bicep).
    timeout-minutes: 130
    defaults:
      run:
        # Naming the shell adds -o pipefail, so a failed az call in a pipeline fails the step.
        shell: bash
    env:
      # Resource names follow infra/deploy.ps1, which names the production resources "prod".
      RESOURCE_SUFFIX: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
    steps:
      - name: Azure CLI - Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The index script takes a database lock, so a run started while another is going waits up to 30 minutes for it to
      # finish. If it gets the lock it indexes as usual; if not, it indexes nothing and still ends Succeeded.
      - name: Start the index job
        id: start
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          REEMBED: ${{ inputs.reembed }}
          ALLOW_REMOVALS: ${{ inputs.allow_removals }}
        run: |
          JOB_NAME="caj-sswrules-chat-index-$RESOURCE_SUFFIX"
          ARGS=()
          if [ "$REEMBED" = "true" ]; then ARGS+=(--reembed); fi
          if [ "$ALLOW_REMOVALS" = "true" ]; then ARGS+=(--allow-removals); fi

          if [ ${#ARGS[@]} -eq 0 ]; then
            EXECUTION=$(az containerapp job start --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          else
            # az containerapp job start --args sends a container with only the arguments, not the job's image and settings.
            # So this starts the run with the job's own container, plus the arguments. It copies only the fields the run
            # needs, because the job can carry fields newer than the API version this request uses (such as imageType).
            JOB_ID=$(az containerapp job show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" --query id --output tsv)
            ARGS_JSON=$(printf '%s\n' "${ARGS[@]}" | jq --raw-input . | jq --slurp --compact-output .)
            TEMPLATE=$(az containerapp job show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0]" --output json \
              | jq --argjson args "$ARGS_JSON" '{containers: [{name, image, env, resources, args: $args}]}')
            EXECUTION=$(az rest --method post --url "https://management.azure.com$JOB_ID/start?api-version=2024-03-01" \
              --headers "Content-Type=application/json" --body "$TEMPLATE" --query name --output tsv)
          fi
          if [ -z "$EXECUTION" ]; then
            echo "::error::Azure didn't return the name of the started execution."
            exit 1
          fi
          echo "Started execution $EXECUTION${ARGS[*]:+ with ${ARGS[*]}}. Its logs are in the job's Execution history in the Azure portal."
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"

      - name: Wait for the index job
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXECUTION: ${{ steps.start.outputs.execution }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          JOB_NAME="caj-sswrules-chat-index-$RESOURCE_SUFFIX"

          # The Azure CLI can't renew its token with the GitHub token it logged in with, because that token expires after a
          # few minutes (AADSTS700024). So a long run logs in again with a new one.
          # Called from an if, where -e doesn't apply, so each command returns on failure itself.
          login_again() {
            local token
            token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -er .value) || return 1
            az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" \
              --output none || return 1
            az account set --subscription "$AZURE_SUBSCRIPTION_ID" || return 1
          }

          status() {
            az containerapp job execution show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" --query properties.status --output tsv
          }

          # A failed read can be a passing ARM or network error while the run goes on, so only several in a row fail the step.
          FAILED_READS=0
          while :; do
            if ! STATUS=$(status); then
              FAILED_READS=$((FAILED_READS + 1))
              if [ "$FAILED_READS" -ge 3 ]; then
                echo "::error::Reading the status of execution $EXECUTION failed 3 times in a row. It may still be running; check the job's Execution history in the Azure portal."
                exit 1
              fi
              echo "Reading the execution's status failed ($FAILED_READS of 3). Logging in to Azure again."
              if ! login_again; then echo "Logging in to Azure again failed."; fi
              sleep 60
              continue
            fi
            FAILED_READS=0
            case "$STATUS" in
              Succeeded)
                echo "Execution $EXECUTION succeeded."
                break
                ;;
              Failed | Stopped | Degraded)
                echo "::error::Execution $EXECUTION ended $STATUS. Its logs are in the job's Execution history in the Azure portal."
                exit 1
                ;;
            esac
            sleep 60
          done
