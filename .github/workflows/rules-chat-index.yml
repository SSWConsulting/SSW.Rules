name: Index Rules for The Rulekeeper

# Starts the Container Apps index job now, instead of waiting for its hourly run. Without options it embeds only the new
# and changed rules, like the hourly run.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to index"
        type: choice
        default: staging
        options:
          - staging
          - production
      reembed:
        description: "Embed every rule again, replacing each one as it goes (the chat keeps a full index throughout)"
        type: boolean
        default: false
      allow_removals:
        description: "Allow removals: let this run remove more than a fifth of the index (only when that many rules really were archived or deleted)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  start-index-job:
    name: Start Index Job
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      # Resource names follow infra/deploy.ps1, which names the production resources "prod".
      RESOURCE_SUFFIX: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
    steps:
      - name: Azure CLI - Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The index script takes a database lock, so a run started while another is going waits up to 30 minutes for it to
      # finish, then indexes any rules that changed since.
      - name: Start the index job
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          REEMBED: ${{ inputs.reembed }}
          ALLOW_REMOVALS: ${{ inputs.allow_removals }}
        run: |
          JOB_NAME="caj-sswrules-chat-index-$RESOURCE_SUFFIX"
          ARGS=()
          if [ "$REEMBED" = "true" ]; then ARGS+=(--reembed); fi
          if [ "$ALLOW_REMOVALS" = "true" ]; then ARGS+=(--allow-removals); fi

          if [ ${#ARGS[@]} -eq 0 ]; then
            EXECUTION=$(az containerapp job start --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          else
            # az containerapp job start --args sends a container with only the arguments, not the job's image and settings.
            # So this starts the run with the job's own container, plus the arguments.
            JOB_ID=$(az containerapp job show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" --query id --output tsv)
            ARGS_JSON=$(printf '%s\n' "${ARGS[@]}" | jq --raw-input . | jq --slurp --compact-output .)
            TEMPLATE=$(az containerapp job show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.{containers: containers, initContainers: initContainers}" --output json \
              | jq --argjson args "$ARGS_JSON" '.containers[0].args = $args')
            EXECUTION=$(az rest --method post --url "https://management.azure.com$JOB_ID/start?api-version=2024-03-01" \
              --headers "Content-Type=application/json" --body "$TEMPLATE" --query name --output tsv)
          fi
          echo "Started execution $EXECUTION${ARGS[*]:+ with ${ARGS[*]}}. Its logs are in the job's Execution history in the Azure portal."
