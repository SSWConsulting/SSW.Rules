name: Scheduled Production Deploy

# Production ships main once a day. Besides code, each build refreshes what is generated from SSW.Rules.Content:
# the Algolia index, redirects, the orphaned rules list and people-latest-rules.json.
on:
  schedule:
    # 1:00 AM US Eastern (EST) / 2:00 AM (EDT) — every day
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  deploy-main:
    name: Deploy main to production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deployment
        run: |
          gh workflow run build-and-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f environment=production
          echo "✅ Production deployment of main triggered"
        env:
          GH_TOKEN: ${{ github.token }}
