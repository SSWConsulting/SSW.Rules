# Local SQL Server 2025 for the Rules Chat vector index.
# Started by pnpm rules-chat:setup. See docs/rulekeeper/local-development.md.
services:
  rules-chat-sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ssw-rules-chat-sql
    # Microsoft publishes this image for amd64 only; Apple Silicon runs it under emulation.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${RULES_CHAT_SQL_PASSWORD:?Set RULES_CHAT_SQL_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - rules-chat-sql-data:/var/opt/mssql

volumes:
  rules-chat-sql-data:
